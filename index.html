TODO — قائمة التنفيذ للسيشن الجاية (أداة متابعة الملاك)
تعليمات: نفّذ النقاط دي على دفعات صغيرة، كل دفعة ملف شغّال. القائمة دي هي المرجع.
المحرّك الحالي سليم ومُختبَر (تواريخ/قاعدة 15-16/التجديد/السداد/التقرير/الوسوم) — تعديلات واجهة وعرض غالبًا.

[x] 1) تطبيع أرقام التليفون (مالك + إنستاباي) زي الأداة الأصلية:
       - الموبايل المصري يتنسّق 11 رقم بادئة 01 (معالجة بلع الصفر و +20 / 0020).
       - منطق إنستاباي: لو طريقة الدفع إنستا والبنك فاضي → رقم الحساب يتعامل كموبايل ويتنسّق.
       (يُطبّق في عرض بيانات المالك/التحويل وأزرار النسخ.)
[x] 2) ستبر عدد شهور السداد "على مستوى المالك" في وضع السداد:
       - ستبر واحد +/- على رأس كارت المالك. تغييره يطبّق نفس عدد الشهور على كل وحدات المالك،
         وكل وحدة تجمّع مستحقات الشهور دي بقيمها الفعلية (تحترم الزيادات)، وإجمالي المالك يتحدّث.
       - "المفروض" (الدورية) يفضل ظاهر كمرجع. الوحدات الأقصر دورة تتأثر بالقدر المتاح.
       - يفضل ينفع تعدّل وحدة بعينها استثناءً، بس الافتراضي على مستوى المالك.
[x] 3) "عدد الغرف" يتعرض ككلمة bedroom (انجليزي) بدل "غرف" — اتساقًا مع وصف الوحدة الانجليزي.
[x] 4) "عدد الشهور" يتعرض ككلمة month بدل حرف "ش".
[x] 5) في الـPDF/التقرير: وضّح قيمة الشهر الواحد جنب الإجمالي.
       - شهور متساوية: 3 × 40,000 = 120,000
       - فيها اختلاف (زيادة): تتفصّل سطر لكل شهر بمدّته وقيمته:
           • يوليو 2026  01/07←31/07  50,000
           • أغسطس 2026 01/08←31/08  55,000
           • سبتمبر 2026 01/09←30/09  55,000
         والإجمالي فوقهم.
[x] 6) كارت/صفحة المالك = مستند تحويل كامل بنفس كيفية التقرير المجمّع:
       - بيانات حسابه كاملة (مستفيد/بنك/حساب/تليفون/طريقة الدفع) + اللي المفروض يتدفع (وحداته بالمدد والقيم) + إجماليه.
       - قابل للطباعة في ورقة واحدة لكل مالك.
[x] 7) أزرار نسخ (النص دايمًا انجليزي/LTR عشان ما يلخبطش العرض/الواتساب):
       - نسخ كل بند تحويل لوحده (حقل/حقل).
       - نسخ بيانات التحويل مجمّعة (الحساب كامل رسالة واحدة).
       - نسخ الوحدات + المدد + القيم (ملخّص دفعات نصّي).
[x] 8) طباعة:
       - زر في صفحة المالك → ورقة المالك لوحده.
       - زر "طباعة الكل" في السداد → ملف فيه كل الملاك المستحقين حسب الفلتر، كل مالك في صفحة مستقلة (page-break).
[x] 9) "قريب" = خلال 15 يوم (بدل 7) — في شريحة التنبيهات وحساب الحالة (SOON_WINDOW=15).
[x] 10) شاشة "ملاحظات/مراجعات" إجمالية تجمّع كل الملاحظات (زيادات/تناقضات/مسدد>مستحق/عدم تطابق…)
        بتفاصيل كل ملاحظة (المالك + الوحدة + النص)، تضغط منها تروح للوحدة، وقابلة للتصدير Excel + PDF.

ملاحظات سياق مهمة محسومة سابقًا (ماتتغيّرش):
- المصفوفة = مصدر الحقيقة للمستحقات (مش العقود). الصيغة المقبولة لأعمدة الشهور: "مستحق 5-2026" أو "مستحق Jun-26".
- قاعدة 15/16 ثابتة. بداية العقد تُستنتج من (نهاية العقد + يوم). "مسدد حتى" يتحوّل للعمود بقاعدة periodColIdx(settled+1)-1.
- الدفعة الربع سنوية = جمع الأعمدة الفعلية (مش ×3). الزيادة عند شهر التجديد تتفسّر كزيادة سنوية.
- holdover: نهاية العقد ماتقطعش الاستحقاقات. الرفع يستبدل/يحدّث بالكود. النسخة الاحتياطية تترفع تاني.
- المسمى "سداد" (مش تحصيل). "تسويات" = وسم نصّي حر + سلوك لكل وسم (تمييز فقط / استبعاد من السداد).
- [x] التعديل اليدوي: زر «تعديل» في صفحة الوحدة (نهاية العقد/يدفع كل/مسدد حتى+تلقائي/قيمة الإيجار/خلايا المصفوفة due+paid، إضافة/مسح شهر) → يعيد الحساب، بادج «يدوي»، وخيار «احتفظ بالتعديلات اليدوية» وقت التحديث.
- [x] تقرير الكمبوند (الإيجارات): اختيار كمبوند + شهر، الوحدات مقسّمة بعدد الغرف (bedroom/غير محدّد)،
      الإيجار = مستحق نفس الشهر، ترتيب تصاعدي/تنازلي، متوسط+إجمالي لكل قسم، تصدير Excel/PDF. (زر «كمبوند» في الشريط)
- [x] تأمين البيانات: تذكير نسخة احتياطية (7 أيام / 20 تعديل) كلافتة فوق، عدّاد تغييرات يتصفّر عند الباك‌أب،
      نسخة تلقائية محلية (AUTO_KEY) بعد كل تعديل + زر «استرجاع نسخة تلقائية» في الفوتر، وسطر حالة آخر باك‌أب.
==================================================================================

const norm = (s)=>String(s==null?"":s).trim();

const txt = (v)=>{const s=norm(v);return (s==="-"||s==="—"||s==="–")?"":s;};

const numTruncated=(v)=>typeof v==="number"&&isFinite(v)&&Math.abs(v)>=1e15;
function num(v){const n=Number(String(v==null?"":v).replace(/[^\d.\-]/g,""));return isNaN(n)?0:n;}
function fmt(n){return Number(Math.round(n||0)).toLocaleString("en-US");}
// name key for grouping (hamza + spaces)
function nameKey(s){return norm(s).replace(/\s+/g," ").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");}

/* ---- date engine (tested) ---- */
function ymdToUTC(a){return Date.UTC(a.y,a.m-1,a.d);}
function utcToYmd(ms){const d=new Date(ms);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()};}
function addDaysYmd(a,n){return utcToYmd(ymdToUTC(a)+n*86400000);}
function daysDiff(a,b){return Math.round((ymdToUTC(a)-ymdToUTC(b))/86400000);}
function monIdxOf(a){return a.y*12+(a.m-1);}
function idxToYM(idx){return {y:Math.floor(idx/12),m:(idx%12)+1};}
function daysInMonth(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();}
function snapMonthEnd(a){if(!a)return a;return (a.d===30||a.d===31)?{y:a.y,m:a.m,d:daysInMonth(a.y,a.m)}:a;}
const MONC=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MON_AR=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function monLabel(idx){const{y,m}=idxToYM(idx);return MONC[m-1]+"-"+String(y%100).padStart(2,"0");}
function monLabelAr(idx){const{y,m}=idxToYM(idx);return MON_AR[m-1]+" "+y;}
function todayYmd(){const d=new Date();return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()};}
function fmtDate(a){if(!a)return "—";return String(a.d).padStart(2,"0")+"/"+String(a.m).padStart(2,"0")+"/"+a.y;}

function toYmd(v){
  if(v==null||v==="")return null;
  if(v instanceof Date && !isNaN(v)) return {y:v.getFullYear(),m:v.getMonth()+1,d:v.getDate()};
  if(typeof v==="number"){ if(v>20000 && v<80000){return utcToYmd(Date.UTC(1899,11,30)+Math.round(v)*86400000);} return null; }
  const s=norm(v);
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); // yyyy-mm-dd
  if(m)return {y:+m[1],m:+m[2],d:+m[3]};
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/); // dd-mm-yyyy
  if(m)return {y:+m[3],m:+m[2],d:+m[1]};
  return null;
}

/* anchor + period helpers */
function anchorOf(endYmd){if(!endYmd)return null;const s=addDaysYmd(snapMonthEnd(endYmd),1);return {day:s.d,month:s.m};}

function unitAnchor(u){ if(u&&u.anchorOverride&&u.anchorOverride.day) return {day:u.anchorOverride.day,month:u.anchorOverride.month||1}; if(calAligned(u)) return {day:1,month:1}; return anchorOf(u?u.contractEnd:null); }
// محاذاة تلقائية للشهر الميلادي: «مسدد حتى» آخر الشهر ونهاية العقد في نصه (اتدفع نص شهر في الأول عشان الإيجار يمشي مع الميلادي)
function calAligned(u){
  if(!u||u.anchorOverride||u.settledFixed||!u.settled||!u.contractEnd) return false;
  if(!isMonthEnd(u.settled)) return false;
  const a=anchorOf(u.contractEnd); return !!(a && a.day!==1);
}
// الشهور اللي «مسدد حتى» مغطّيها في الوحدة المحاذاة — تتعامل كمسددة حتى لو الجدول فيه نص شهر
function coveredBySettled(u,idx){
  if(!calAligned(u)) return false; const {y,m}=idxToYM(idx);
  return ymdToUTC({y,m,d:new Date(Date.UTC(y,m,0)).getUTCDate()})<=ymdToUTC(u.settled);
}
function periodEndU(u,anchor,idx){ return lastMonthFactor(u,idx)<1?u.contractEnd:addDaysYmd(periodStart(anchor,idx+1),-1); }
// آخر شهر في العقد المحاذى = جزء من شهر (مثلاً 1–14 فبراير): نسبة الأيام، وإلا 1
function lastMonthFactor(u,idx){
  if(!calAligned(u)) return 1; const ce=u.contractEnd; if(idx!==ce.y*12+ce.m-1) return 1;
  const dim=new Date(Date.UTC(ce.y,ce.m,0)).getUTCDate(); return ce.d>=dim?1:ce.d/dim;
}
// الأنكور المقترح من «مسدد حتى تاريخ» (اليوم اللي بعده = بداية الدورة)
function anchorFromSettled(u){ if(!u||!u.settled)return null; const s=addDaysYmd(snapMonthEnd(u.settled),1); return {day:s.d,month:s.m}; }
// وحدات فيها تعارض بين الدورة المستنتجة من نهاية العقد ودورة «مسدد حتى»
// هل التاريخ ده آخر يوم في شهره؟
function isMonthEnd(a){ if(!a)return false; return a.d===new Date(Date.UTC(a.y,a.m,0)).getUTCDate(); }
// «مسدد حتى» مكتوب بيوم 1 أو 2 = على الأغلب بداية القسط مش نهايته
function settledLooksShifted(u){
  if(!u||!u.settled) return false;
  if(u.settled.d>2) return false;
  const ce=snapMonthEnd(u.contractEnd);
  return isMonthEnd(ce);                       // بس لو نهاية العقد فعلاً آخر الشهر
}

// ===== زيادة الإيجار الغير مسددة =====
// شهر «فرق زيادة» = اتدفع منه جزء، والجزء ده بيساوي إيجار شهر أقدم أقل (يعني اتدفع بالإيجار القديم)
function oldRentOf(u){
  const all=Object.keys(u.grid).map(Number).sort((a,b)=>a-b);
  let old=null;
  all.forEach(i=>{ const g=u.grid[i]; if(!(g&&g.due>0)) return;
    const paid=g.paid||0;
    if(paid>0.01 && g.due-paid>0.01){
      const prev=all.filter(k=>k<i && u.grid[k].due>0 && u.grid[k].due<g.due-0.01 && Math.abs(u.grid[k].due-paid)<1);
      if(prev.length) old=paid;
    }
  });

}
function isIncreaseIdx(u,idx){
  const g=u.grid[idx]; if(!g||!(g.due>0)) return false;
  const paid=g.paid||0; if(!(paid>0.01 && g.due-paid>0.01)) return false;
  const all=Object.keys(u.grid).map(Number);
  return all.some(k=>k<idx && u.grid[k].due>0 && u.grid[k].due<g.due-0.01 && Math.abs(u.grid[k].due-paid)<1);
}
// الإيجار الفعّال للشهر: لو الزيادة متجاهلة على الوحدة، أي شهر أعلى من القديم يتحسب بالقديم
function effDue(u,idx){
  const g=u.grid[idx]; if(!g) return 0;

  const f=lastMonthFactor(u,idx); return f<1?Math.round(d*f):d;

function effRem(u,idx){ const g=u.grid[idx]; if(!g) return 0; return Math.max(0,effDue(u,idx)-(g.paid||0)); }

function increaseDiff(u){
  if(u.increaseIgnored) return {months:[],total:0,oldRent:null,newRent:null};
  const all=Object.keys(u.grid).map(Number).sort((a,b)=>a-b);
  const months=all.filter(i=>!isIgnoredIdx(u,i) && isIncreaseIdx(u,i));
  const total=months.reduce((s,i)=>s+(u.grid[i].due-(u.grid[i].paid||0)),0);
  const oldR=months.length?(u.grid[months[0]].paid||0):null;
  const newR=months.length?u.grid[months[months.length-1]].due:null;
  return {months,total,oldRent:oldR,newRent:newR};

function setIgnoredIdx(u,idx,val){

function gridGaps(u){
  const all=Object.keys(u.grid).map(Number).sort((a,b)=>a-b);

// ===== مراجعة السداد: فجوات (شهور مش مسددة خالص وبعدها شهور مسددة) + دفعات جزئية =====
// فجوة سداد = مجموعة شهور متتالية مستحقة (due>0) ومفيش عليها أي سداد (paid=0)،
// وبعدها في الجدول شهر مسدد بالكامل — يعني «سيبتها ومشيت» مش «لسه واصل هنا».
function unpaidBlocks(u){
  const all=Object.keys(u.grid).map(Number).sort((a,b)=>a-b);
  const isUnpaid=(i)=>{ const g=u.grid[i]; return g&&g.due>0&&!isIgnoredIdx(u,i)&&(g.paid||0)<=0.0001&&(g.due-(g.paid||0))>0.0001; };
  const isPaidFull=(i)=>{ const g=u.grid[i]; return g&&g.due>0&&!isIgnoredIdx(u,i)&&(g.due-(g.paid||0))<=0.0001; };
  const blocks=[]; let i=0;
  while(i<all.length){
    if(isUnpaid(all[i])){
      const block=[]; let j=i;
      while(j<all.length && isUnpaid(all[j])){ block.push(all[j]); j++; }
      if(all.slice(j).some(k=>isPaidFull(k))) blocks.push(block);   // فيه شهر مسدد بعدها فعلًا
      i=j;
    } else i++;
  }
  return blocks;
}
// دفعات جزئية = شهر مستحق اتسدد منه جزء بس (زي زيادة سنوية متدفوعتش) — في أي مكان بالجدول

const FIELD_DEFS = {

function matchField(headerText){
  const t=norm(headerText), tl=t.toLowerCase();
  for(const f in FIELD_DEFS){const d=FIELD_DEFS[f];

function gridCol(headerText){
  const m=norm(headerText).match(/^(مستحق|مسدد|متبق[ىي])\s+(.+)$/); if(!m)return null;
  const kind = m[1].indexOf("مستحق")===0?"due":(m[1].indexOf("مسدد")===0?"paid":"rem");

    const unit={
      code, name, key,
      project:txt(get(row,"project")), block:txt(get(row,"block")),
      bldg:txt(get(row,"bldg")), apt:txt(get(row,"apt")),
      beds:txt(get(row,"beds")), rent:num(get(row,"rent")), desc:txt(get(row,"desc")),
      tag:txt(get(row,"tag")),
      payMethod:pm, contractEnd:toYmd(get(row,"contractEnd")),

  }
  const owners=order.map(k=>map[k]).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  let notice="";
  if(truncAcc.size){ notice="⚠ أرقام حسابات مخزّنة في إكسل كأرقام وطولها ١٦ خانة أو أكتر — إكسل بيبترها لأصفار جوه الملف نفسه ومفيش أداة تقدر ترجّعها. الحل: في إكسل خلّي عمود الحساب تنسيقه «نص/Text» واكتب الأرقام دي تاني ثم أعد الاستيراد. الملاك المتأثرين: "+[...truncAcc].join("، "); }
  return {owners, warning:"", notice};
}

/* ============================ compute engine ============================ */
const RENEWAL_WINDOW=45, SOON_WINDOW=30;
function computeUnit(u){
  const c={alerts:[], months:[]};
  const months=Object.keys(u.grid).map(Number).sort((a,b)=>a-b);
  c.monthIdxs=months;
  c.months=months.map(idx=>{const g=u.grid[idx];return {idx,due:g.due,paid:g.paid,rem:g.due-g.paid};});
  const T=todayYmd();

  // anchor / renewal
  const anchor=unitAnchor(u);
  c.anchor=anchor;
  c.renewAnchor=anchorOf(u.contractEnd)||anchor;   // التجديد بيفضل على دورة العقد حتى لو الوحدة محاذاة للميلادي
  if(!u.contractEnd) c.alerts.push({lv:"amber",t:"نهاية العقد ناقصة أو غير مقروءة — مش هينفع نحسب التجديد أو الاستحقاق."});
  if(!u.settled) c.alerts.push({lv:"amber",t:"«مسدد حتى تاريخ» ناقص."});

  // settled column = the period whose END is the settled-through date.
  // next period starts the day after; the 15/16 rule on that start day gives the next column, so settled = next-1.
  let providedSettledIdx=null;
  if(u.settled){ providedSettledIdx = periodColIdx(addDaysYmd(u.settled,1)) - 1; }
  c.providedSettledIdx=providedSettledIdx;

  // next due = first month with due>0 and rem>0
  let nextIdx=null;
  u._oldRent=undefined;
  for(const m of c.months){ if(m.due>0 && !isMonthSkip(u,m.idx) && effRem(u,m.idx)>0.0001){ nextIdx=m.idx; break; } }
  c.nextIdx=nextIdx;
  if(nextIdx!=null && anchor){
    const ps=periodStart(anchor,nextIdx);
    c.nextDueDate=ps;
    c.daysToNext=daysDiff(ps,T); // +ve = upcoming, -ve = overdue
  }

  // suggested next payment by periodicity (sum next payEvery due months from nextIdx)
  if(nextIdx!=null){
    let amount=0, taken=0, fromIdx=nextIdx, toIdx=nextIdx, vals=[];
    let cur=nextIdx;
    while(taken<u.payEvery){
      const g=u.grid[cur];
      if(g && g.due>0 && isMonthSkip(u,cur)){ cur++; }
      else if(g && g.due>0){ amount+=effRem(u,cur); vals.push(effDue(u,cur)); toIdx=cur; taken++; cur++; }
      else if(g && g.due===0){ cur++; }            // skip empty gaps
      else break;                                   // no more grid
    }
    let hasInc=false, incNote="";
    for(let k=1;k<vals.length;k++){ if(vals[k]!==vals[k-1]){ hasInc=true; } }
    c.suggest={months:taken, amount, fromIdx, toIdx, hasInc};
  }

  // status
  let status="ok";
  if(nextIdx!=null && c.daysToNext!=null){
    if(c.daysToNext<0) status="overdue";
    else if(c.daysToNext<=SOON_WINDOW) status="soon";
    else status="upcoming";
  } else if(nextIdx==null){ status="settled"; }
  // renewal status
  let renewal=null;
  if(u.contractEnd){
    const dEnd=daysDiff(u.contractEnd,T);
    if(dEnd<0) renewal={kind:"holdover",days:-dEnd};
    else if(dEnd<=RENEWAL_WINDOW) renewal={kind:"soon",days:dEnd};
  }
  c.status=status; c.renewal=renewal;

  // ---- increase / renewal-increase detection ----
  if(anchor && c.months.length>1){
    const dueAt={}; c.months.forEach(m=>{dueAt[m.idx]=m.due;});
    const minY=idxToYM(months[0]).y-1, maxY=idxToYM(months[months.length-1]).y+1;
    const renewalCols={};
    for(let Y=minY;Y<=maxY;Y++){ renewalCols[renewalCol(c.renewAnchor,Y)]=true; }
    // consecutive changes
    for(let k=1;k<c.months.length;k++){
      const cur=c.months[k], prev=c.months[k-1];
      if(cur.idx!==prev.idx+1) continue;
      if(!(cur.due>0 && prev.due>0)) continue;
      if(cur.due!==prev.due){
        const diff=cur.due-prev.due, pct=prev.due? Math.round(diff/prev.due*1000)/10 : 0;
        const sign=diff>0?"+":"";
        if(renewalCols[cur.idx]) c.alerts.push({lv:"info",t:"زيادة تجديد عند "+monLabelAr(cur.idx)+": "+sign+fmt(diff)+" ("+sign+pct+"%) — راجِع القيمة."});
        else c.alerts.push({lv:"amber",t:"زيادة في "+monLabelAr(cur.idx)+" في غير شهر التجديد: "+sign+fmt(diff)+" ("+sign+pct+"%) — راجِع."});
      }
    }
    // renewal columns with no change
    for(const colS in renewalCols){
      const col=+colS; const prev=col-1;
      if(dueAt[col]>0 && dueAt[prev]>0 && dueAt[col]===dueAt[prev]){
        c.alerts.push({lv:"amber",t:"مفيش زيادة عند تجديد العقد ("+monLabelAr(col)+") — اتأكد إن مفيش زيادة سنوية."});
      }
    }
  }

  // ---- paid > due ----
  c.months.forEach(m=>{ if(m.paid>m.due+0.0001) c.alerts.push({lv:"red",t:"مسدد أكبر من المستحق في "+monLabelAr(m.idx)+" (مسدد "+fmt(m.paid)+" / مستحق "+fmt(m.due)+")."}); });

  // ---- settled-through inconsistency: any month <= settled with remaining ----
  if(providedSettledIdx!=null){
    c.months.forEach(m=>{ if(m.idx<=providedSettledIdx && m.due>0 && m.rem>0.0001) c.alerts.push({lv:"red",t:"«مسدد حتى» بيقول "+fmtDate(u.settled)+" لكن "+monLabelAr(m.idx)+" لسه فيه متبقّى "+fmt(m.rem)+"."}); });
  }

  if(unitExcluded(u)){ c.excluded=true; c.alerts=[]; c.status="excluded"; c.renewal=null; c.suggest=null; }
  return c;
}
function computeAll(){
  state.owners.forEach(o=>{ o._worst=0; o.units.forEach(u=>{ u._c=computeUnit(u); o._worst=Math.max(o._worst, sevOf(u._c)); }); });
}
function sevOf(c){ // severity for sorting/badges
  if(c.status==="overdue") return 4;
  if(c.renewal && c.renewal.kind==="holdover") return 3;
  if(c.status==="soon" || (c.renewal&&c.renewal.kind==="soon")) return 2;
  if(c.alerts.some(a=>a.lv==="red")) return 4;
  if(c.alerts.length) return 1;
  return 0;
}

/* ============================ payments engine ============================ */
// sum remaining of the next n unpaid due months (oldest first)
function dueAmount(u,n){ return unitMonthsBreakdown(u,n).total; }
const MON_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monLabelEn(idx){const{y,m}=idxToYM(idx);return MON_EN[m-1]+" "+y;}
// next n unpaid months for a unit, each with its period (from→to) and remaining value
function unitMonthsBreakdown(u,n){
  u._oldRent=undefined;
  const anchor=unitAnchor(u)||{day:1,month:1};
  const N=Math.max(0,n|0);
  const all=Object.keys(u.grid).map(Number).sort((a,b)=>a-b);
  const realIdx=all.filter(i=>u.grid[i].due>0);
  const lastReal=realIdx.length?realIdx[realIdx.length-1]:null;
  // أول شهر مش مدفوع (بالإيجار الفعّال) — فروق الزيادة والمتجاهل مش بيتعدّوا هنا
  const firstUnpaid=all.filter(i=>u.grid[i].due>0 && !isMonthSkip(u,i) && effRem(u,i)>0.0001)[0];
  const take=[]; const gapMonths=[];
  if(firstUnpaid!=null){
    for(let k=all.indexOf(firstUnpaid); k<all.length && take.length<N; k++){
      const i=all[k], g=u.grid[i];
      if(!(g.due>0)){
        if(lastReal!=null && i<lastReal){ gapMonths.push(i); break; }
        break;
      }
      if(isMonthSkip(u,i)) continue;
      if(effRem(u,i)>0.0001) take.push(i);
    }
  }
  const blocked=gapMonths.length>0;
  const lines=take.map(idx=>{const g=u.grid[idx];const paid=g.paid||0;const d=effDue(u,idx);return {idx,from:periodStart(anchor,idx),to:periodEndU(u,anchor,idx),due:d,paid,value:Math.max(0,d-paid),partial:paid>0.0001};});
  if(lines.length<N && !blocked){
    // التقدير بآخر إيجار فعّال (لو الزيادة متجاهلة = الإيجار القديم)
    const rentGuess=lastReal!=null?effDue(u,lastReal):0;
    let lastIdx=lines.length?lines[lines.length-1].idx:lastReal;
    let guard=0;
    while(lines.length<N && rentGuess>0 && lastIdx!=null && guard++<120){
      lastIdx+=1;
      if(u.grid[lastIdx] && u.grid[lastIdx].due>0){
        if(isMonthSkip(u,lastIdx)) continue;
        const g=u.grid[lastIdx], paid=g.paid||0, d=effDue(u,lastIdx);
        if((d-paid)>0.0001) lines.push({idx:lastIdx,from:periodStart(anchor,lastIdx),to:periodEndU(u,anchor,lastIdx),due:d,paid,value:d-paid,partial:paid>0.0001});
        continue;
      }
      const from=periodStart(anchor,lastIdx);
      const beyond=u.contractEnd?(ymdToUTC(from)>ymdToUTC(u.contractEnd)):false;
      const rg=Math.round(rentGuess*lastMonthFactor(u,lastIdx)); lines.push({idx:lastIdx,from,to:periodEndU(u,anchor,lastIdx),due:rg,paid:0,value:rg,partial:false,estimated:true,beyond});
    }
  }
  // فروق الزيادة — بند منفصل؛ بتدخل الإجمالي بس لو الخانة متعلّمة على الوحدة
  const inc=increaseDiff(u);
  const monthsTotal=lines.reduce((s,l)=>s+l.value,0);
  const incIncluded=!!(u.incInclude && inc.total>0);
  const total=monthsTotal+(incIncluded?inc.total:0);
  const rr=lines.map(l=>Math.round(l.value));
  const hasPartial=lines.some(l=>l.partial);
  const hasEstimated=lines.some(l=>l.estimated);
  const hasBeyond=lines.some(l=>l.beyond);
  const hasMissingDue=lines.some(l=>l.estimated&&!l.beyond);
  return {lines,total,monthsTotal,inc,incIncluded,count:lines.length,hasPartial,hasEstimated,hasBeyond,hasMissingDue,blocked,gapMonths,shortBy:Math.max(0,N-lines.length),equal:!hasPartial&&!hasEstimated&&rr.length>0&&rr.every(v=>v===rr[0]),perMonth:lines.length?lines[0].value:0};
}

function ownerMonthsFor(o){const m=state.report; if(m&&m.ownerMonths&&m.ownerMonths[o.key]!=null)return m.ownerMonths[o.key]; const pu=ownerPayableUnits(o); return Math.max(1,...pu.map(u=>u.payEvery||1));}

// re-derive "مسدد حتى تاريخ" from the grid + anchor (date before the first unpaid period)
function recomputeSettled(u){
  const anchor=unitAnchor(u); if(!anchor) return;
  const idxs=Object.keys(u.grid).map(Number).sort((a,b)=>a-b);
  let nextIdx=null;
  u._oldRent=undefined;
  for(const idx of idxs){const g=u.grid[idx];if(g.due>0&&!isMonthSkip(u,idx)&&effRem(u,idx)>0.0001){nextIdx=idx;break;}}
  let boundary;
  if(nextIdx!=null) boundary=nextIdx;
  else { let last=null; for(const idx of idxs) if(u.grid[idx].due>0) last=idx; if(last==null) return; boundary=last+1; }
  u.settled=addDaysYmd(periodStart(anchor,boundary),-1);
}
// allocate an amount to oldest unpaid months, log a payment
function recordPayment(u,amount,dateYmd,source,note){
  u._oldRent=undefined;
  const incIdx=(u.incInclude && !u.increaseIgnored)?increaseDiff(u).months:[];
  const sorted=Object.keys(u.grid).map(Number).sort((a,b)=>a-b);
  const realIdx=sorted.filter(i=>u.grid[i].due>0);
  const firstReal=realIdx.length?realIdx[0]:null;
  const lastReal=realIdx.length?realIdx[realIdx.length-1]:null;
  let remaining=amount; const allocated=[]; let hitGap=false;
  // فروق الزيادة (لو متعلّمة للضم) بتتسدد الأول
  incIdx.forEach(idx=>{ if(remaining<=0.0001)return; const g=u.grid[idx]; const need=g.due-(g.paid||0);
    if(need>0.0001){ const pay=Math.min(need,remaining); g.paid=(g.paid||0)+pay; remaining-=pay; allocated.push({idx,amt:pay,inc:true}); } });
  for(const idx of sorted){
    const g=u.grid[idx];
    // الفجوة الحقيقية = صفر بين أقساط حقيقية.
    // الأصفار قبل أول قسط (شهور خارج العقد) أو بعد آخر قسط ما توقفش الترحيل.
    if(!(g.due>0)){
      if(firstReal!=null && lastReal!=null && idx>firstReal && idx<lastReal){ hitGap=true; break; }
      continue;
    }
    if(isMonthSkip(u,idx)) continue;                        // متجاهل أو فرق زيادة — يتخطّاه
    const need=effDue(u,idx)-(g.paid||0); if(need<=0.0001)continue;
    const pay=Math.min(need,remaining); if(pay<=0)break;
    g.paid+=pay; remaining-=pay; allocated.push({idx,amt:pay});
    if(remaining<=0.0001)break;
  }
  // leftover beyond recorded dues -> materialize forward months at last recorded monthly rent (last may be partial)
  if(remaining>0.0001 && !hitGap){
    const dueMonths=sorted.filter(i=>u.grid[i].due>0);
    const rentGuess=dueMonths.length?effDue(u,dueMonths[dueMonths.length-1]):0;
    // ⚠ لازم نبدأ من بعد آخر قسط حقيقي — مش من بعد آخر صف في الجدول.
    // الصفوف الفاضية اللي في الآخر لازم تتملّى الأول، وإلا هتفضل فجوة في النص.
    let lastIdx=dueMonths.length?dueMonths[dueMonths.length-1]:(sorted.length?sorted[sorted.length-1]:null);
    let guard=0;
    while(remaining>0.0001 && rentGuess>0 && lastIdx!=null && guard++<120){
      lastIdx+=1; const pay=Math.min(Math.round(rentGuess*lastMonthFactor(u,lastIdx)),remaining);
      const cur=u.grid[lastIdx];
      if(cur && cur.due>0){                       // صف موجود بقسط حقيقي: كمّل عليه
        if(isMonthSkip(u,lastIdx)) continue;
        const need=effDue(u,lastIdx)-(cur.paid||0);
        if(need>0.0001){ const p2=Math.min(need,remaining); cur.paid=(cur.paid||0)+p2; remaining-=p2; allocated.push({idx:lastIdx,amt:p2}); }
        continue;
      }
      u.grid[lastIdx]={due:rentGuess,paid:pay,created:true};
      remaining-=pay; allocated.push({idx:lastIdx,amt:pay,created:true});
    }
  }
  u.payments=u.payments||[];
  u.payments.push({id:String(Date.now())+Math.random().toString(36).slice(2,6),date:dateYmd,amount,source,note:note||"",allocated,leftover:Math.max(0,Math.round(remaining)),blocked:hitGap||undefined});
  recomputeSettled(u);
}
function removePayment(u,id){
  const arr=u.payments||[]; const i=arr.findIndex(p=>p.id===id); if(i<0)return;
  (arr[i].allocated||[]).forEach(a=>{const g=u.grid[a.idx]; if(g) g.paid=Math.max(0,g.paid-a.amt);});
  arr.splice(i,1);

  Object.keys(u.grid).map(Number).forEach(idx=>{const g=u.grid[idx]; if(g&&g.created&&g.paid<=0.0001) delete u.grid[idx];});
  recomputeSettled(u);
}

function detectConflicts(newOwners){

  state.owners.forEach(o=>{
    if(o.edited){
      const hit=o.units.map(u=>newByCode[u.code]).find(Boolean);
      if(hit){ const n=hit.o;
        [["البنك","bank"],["اسم المستفيد","benName"],["رقم الحساب","benAcc"],["التليفون","phone"]].forEach(([lbl,k])=>{
          if(F(o[k])!==F(n[k]) && F(n[k])) out.push({who:o.name,what:lbl,mine:F(o[k])||"—",file:F(n[k])});
        });

    }
    o.units.forEach(u=>{ if(!u.edited)return; const hit=newByCode[u.code]; if(!hit)return; const n=hit.u;
      const ds=a=>a?(String(a.d).padStart(2,"0")+"/"+String(a.m).padStart(2,"0")+"/"+a.y):"";
      if(u.contractEnd&&n.contractEnd&&ds(u.contractEnd)!==ds(n.contractEnd)) out.push({who:o.name+" · "+u.code,what:"نهاية العقد",mine:ds(u.contractEnd),file:ds(n.contractEnd)});
      if((u.payEvery||1)!==(n.payEvery||1)) out.push({who:o.name+" · "+u.code,what:"دورية السداد",mine:(u.payEvery||1)+" شهر",file:(n.payEvery||1)+" شهر"});

function applyData(newOwners, fileName, mode, keepEdits){

    const newByCode={}; newOwners.forEach(o=>o.units.forEach(u=>newByCode[u.code]=u));

    newOwners.forEach(o=>{ if(keep[o.key]){ o.units=o.units.concat(keep[o.key].units); delete keep[o.key]; } });

function compGroupOf(name){const n=String(name||"").toLowerCase();

  if(/village|فيلدج|فيليدج|فيلج/.test(n))return "فيلدج";
  return "الخارج";}
function compGroups(){const g={"بورتو":[],"ميفيدا":[],"فيلدج":[],"الخارج":[]};allCompounds().forEach(c=>g[compGroupOf(c)].push(c));return g;}
// توحيد اسم البنك: يمنع اعتبار "CIB" و"cib" و"National Bank of Egypt" و"NATIONAL BANK OF EGYPT" بنوك مختلفة

function bankOf(o){ const bk=norm(o.bank); if(bk) return bankDisplay(bankKey(bk)); if(isInsta(o)) return "إنستاباي"; return "غير محدّد"; }
function bankDisplay(k){ // أول صيغة مكتوبة للبنك هي المعروضة (ثابتة عبر الجلسة)
  if(!state._bankNames) state._bankNames={};
  if(!state._bankNames[k]){ let disp=k;
    state.owners.some(o=>{ const raw=norm(o.bank); if(raw&&bankKey(raw)===k){ disp=raw; return true; } return false; });
    state._bankNames[k]=disp; }
  return state._bankNames[k]; }
// ===== المستفيد: نفس اسم المستفيد + نفس رقم الحساب/إنستاباي = مستفيد واحد =====
function benAccKey(o){ const a=String((o&&o.benAcc)||"").replace(/[\s-]/g,"").toLowerCase(); return a; }
function benNameKey(o){ const n=norm((o&&o.benName)||""); return String(n||"").replace(/\s+/g," ").trim().toLowerCase(); }
// المفتاح = الاسم + الحساب معًا (الاتنين لازم يتطابقوا)
function benKey(o){ const a=benAccKey(o), n=benNameKey(o); if(!a||!n) return null; return n+"|"+a; }
function benLabel(o){ return norm(o.benName)||norm(o.name)||"—"; }
// خريطة المستفيدين المشتركين: مفتاح -> قائمة الملاك (٢ فأكتر بس)
function sharedBenMap(){

  Object.keys(m).forEach(k=>{ if(m[k].length<2) delete m[k]; });
  return m;
}
// ===== العرض بالمستفيد: المستفيد اللي ليه أكتر من وحدة يتجمع في كارت واحد باسمه =====
function unitsWord(n){ return n===1?"وحدة واحدة":(n===2?"وحدتين":(n<=10?(n+" وحدات"):(n+" وحدة"))); }
function ownersWord(n){ return n===1?"مالك واحد":(n===2?"مالكين":(n<=10?(n+" ملاك"):(n+" مالك"))); }
function benUnitCount(){ const m={}; state.owners.forEach(o=>{ const k=benKey(o); if(!k)return; m[k]=(m[k]||0)+o.units.filter(u=>unitVisible(u)&&!unitExcluded(u)).length; }); return m; }
function mergeBen(data){
  const cnt=benUnitCount(); const out=[], idx={};
  data.forEach(g=>{ const k=benKey(g.o);
    if(k && cnt[k]>1){
      if(idx[k]==null){ idx[k]=out.length; out.push({ben:true,key:"ben:"+k,benK:k,label:benLabel(g.o),o:g.o,groups:[],rows:[],subtotal:0}); }
      const c=out[idx[k]]; c.groups.push(g); c.rows=c.rows.concat(g.rows.map(x=>({u:x.u,p:x.p,o:g.o}))); c.subtotal+=g.subtotal;
    } else out.push(g); });
  out.forEach(c=>{ if(c.ben){ c.rows.sort((a,b)=>ymdToUTC(a.p.dueDate)-ymdToUTC(b.p.dueDate)||codeCmp(a.u.code,b.u.code)); c.earliest=c.rows[0].p.dueDate; c.minCode=minCode(c.rows); } });
  out.sort((a,b)=>ymdToUTC(a.earliest)-ymdToUTC(b.earliest)||codeCmp(a.minCode||minCode(a.rows),b.minCode||minCode(b.rows)));
  return out;
}

function unitPayBlock(u,ps,m){

function mainTotals(){
  const m=ensureMain();
  // sync visible rows into state first, then count from state so hidden (searched-away) checks still count
  document.querySelectorAll(".pay-row").forEach(row=>{const r=m.rows[row.dataset.key]=m.rows[row.dataset.key]||{};const ch=row.querySelector(".pay-check");if(ch)r.checked=ch.checked;const am=row.querySelector(".pay-amt");if(am)r.amount=parseFloat(am.value.replace(/[^\d.]/g,""))||0;if(row.dataset.owner)r.owner=row.dataset.owner;});
  let n=0,t=0; const visible=new Set(); document.querySelectorAll(".pay-row").forEach(row=>visible.add(row.dataset.key));
  let hidden=0; Object.keys(m.rows).forEach(k=>{const r=m.rows[k];if(r.checked){n++;t+=(r.amount>0?r.amount:0);if(!visible.has(k))hidden++;}});
  const c=document.getElementById("bulkCount"),tt=document.getElementById("bulkTotal");if(c)c.textContent=n;if(tt)tt.textContent=fmt(t);
  const hh=document.getElementById("bulkHiddenHint"); if(hh){ if(hidden>0){hh.textContent="✓ منهم "+hidden+" وحدة محدّدة خارج نتيجة البحث/الفلتر الحالي — محفوظة ومتحسبة."; hh.classList.remove("hidden");} else hh.classList.add("hidden"); }
}

function monthStripHTML(u,c){
  u._oldRent=undefined;
  const anchor=unitAnchor(u)||{day:1,month:1}; const T=todayYmd();
  const all=Object.keys(u.grid).map(Number).sort((a,b)=>a-b);
  const real=all.filter(i=>u.grid[i].due>0); if(!real.length) return "";
  const first=real[0], last=real[real.length-1];
  const items=[];
  for(let i=first;i<=last;i++){ const g=u.grid[i];
    if(!g||!(g.due>0)){ items.push({idx:i,kind:"gap"}); continue; }
    const due=effDue(u,i), paid=g.paid||0, rem=effRem(u,i);
    if(u.ignoredIdx&&u.ignoredIdx[i]){ items.push({idx:i,kind:"ign",due,paid,rem:0}); continue; }
    if(coveredBySettled(u,i)||rem<=0.0001){ items.push({idx:i,kind:"paid",due,paid:Math.max(paid,due),rem:0}); continue; }
    const inc=!u.increaseIgnored && isIncreaseIdx(u,i);

      v=fmt(x.rem)+(x.part?'<div class="text-[8.5px] font-semibold">'+(x.inc?"فرق زيادة":"جزئي")+'</div>':''); }
    return '<button data-act="unitMon" data-idx="'+x.idx+'" class="rounded-lg border py-1 px-0.5 text-center leading-tight min-w-0 '+cls+(x.idx===sel?' ring-2 ring-stone-500 ring-offset-1':'')+'">'+
      '<div class="text-[10px] font-semibold truncate">'+MON_AR[m-1]+'</div><div class="text-[10px] tnum font-bold truncate">'+v+'</div></button>'; };
  const years={}; items.forEach(x=>{ const y=idxToYM(x.idx).y; (years[y]=years[y]||[]).push(x); });
  const grid=Object.keys(years).map(y=>'<div class="mb-2"><div class="text-[10px] font-bold text-stone-400 mb-1">'+y+'</div><div class="grid grid-cols-6 gap-1">'+years[y].map(box).join("")+'</div></div>').join("");

function stamp(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function endOfMonthYmd(y,m){return {y,m,d:daysInMonth(y,m)};}
function addMonthsYmd(a,n){const idx=monIdxOf(a)+n;const{y,m}=idxToYM(idx);return {y,m,d:Math.min(a.d,daysInMonth(y,m))};}
function inRange(d,from,to){const v=ymdToUTC(d);return (!from||v>=ymdToUTC(from))&&(!to||v<=ymdToUTC(to));}
// split a unit's unpaid dues into periodicity-sized payment bundles
function unitDuePayments(u){
  const anchor=unitAnchor(u)||{day:1,month:1};
  const ev=u.payEvery||1;
  u._oldRent=undefined;
  const idxs=Object.keys(u.grid).map(Number).sort((a,b)=>a-b).filter(i=>u.grid[i].due>0&&!isMonthSkip(u,i)&&effRem(u,i)>0.0001);
  const out=[]; let i=0;
  while(i<idxs.length){
    const group=idxs.slice(i,i+ev); const firstIdx=group[0], lastG=group[group.length-1];
    const amount=group.reduce((s,idx)=>s+effRem(u,idx),0);
    const gross=group.reduce((s,idx)=>s+effDue(u,idx),0);
    const paidSum=group.reduce((s,idx)=>s+(u.grid[idx].paid||0),0);
    out.push({dueDate:periodStart(anchor,firstIdx),months:group.length,amount,gross,paid:paidSum,partial:paidSum>0.0001,estimated:false,beyond:false,from:periodStart(anchor,firstIdx),to:periodEndU(u,anchor,lastG),firstIdx,lastIdx:lastG,idxs:group.slice()});
    i+=ev;
  }
  // forward visibility: if the next un-recorded period becomes due within the alert horizon, surface it
  // as ONE estimated group (priced at the last recorded monthly rent) instead of staying silently invisible.
  const allDueIdx=Object.keys(u.grid).map(Number).filter(i=>u.grid[i].due>0).sort((a,b)=>a-b);
  if(allDueIdx.length){
    const lastKnown=allDueIdx[allDueIdx.length-1];
    const rentGuess=effDue(u,lastKnown);
    if(rentGuess>0){
      const horizon=addDaysYmd(todayYmd(),RENEWAL_WINDOW);
      let cur=lastKnown, guard=0;
      while(guard++<60){
        const group=[];
        for(let k=1;k<=ev;k++){
          const idx=cur+k; const from=periodStart(anchor,idx);
          if(ymdToUTC(from)>ymdToUTC(horizon))break;
          group.push(idx);
        }
        if(!group.length)break;
        const firstIdx=group[0], lastG=group[group.length-1];
        const amount=group.reduce((s,idx)=>s+Math.round(rentGuess*lastMonthFactor(u,idx)),0);
        const beyond=u.contractEnd?(ymdToUTC(periodStart(anchor,firstIdx))>ymdToUTC(u.contractEnd)):false;
        out.push({dueDate:periodStart(anchor,firstIdx),months:group.length,amount,gross:amount,paid:0,partial:false,estimated:true,beyond,from:periodStart(anchor,firstIdx),to:periodEndU(u,anchor,lastG),firstIdx,lastIdx:lastG,estRate:rentGuess});
        cur=lastG;
      }
    }
  }
  return out;
}

function codeCmp(a,b){ return String(a||"").localeCompare(String(b||""),"en",{numeric:true}); }
function minCode(rows){ let m=null; rows.forEach(x=>{ if(m===null||codeCmp(x.u.code,m)<0) m=x.u.code; }); return m; }
function buildReport(){
  const r=state.report||{}; const res=[];
  state.owners.forEach(o=>{
    if(r.benKey && benKey(o)!==r.benKey) return;   // عزل مجموعة المستفيد يشمل الطباعة والتصدير
    const rows=[];
    o.units.forEach(u=>{ if(!unitVisible(u)||unitExcluded(u))return; unitDuePayments(u).forEach(p=>{ if(inRange(p.dueDate,r.from,r.to)) rows.push({u,p}); }); });
    if(rows.length){ rows.sort((a,b)=>ymdToUTC(a.p.dueDate)-ymdToUTC(b.p.dueDate)||codeCmp(a.u.code,b.u.code)); res.push({o,rows,minCode:minCode(rows),subtotal:rows.reduce((s,x)=>s+x.p.amount,0),earliest:rows[0].p.dueDate}); }
  });
  res.sort((a,b)=>ymdToUTC(a.earliest)-ymdToUTC(b.earliest)||codeCmp(a.minCode,b.minCode));
  return res;
}

function untilOptions(){
  const t=todayYmd(); const out=[];
  // كل مرشّح: يوم 10 أو 20 في الشهر الحالي أو الشهور الجاية، اللي >= النهارده
  let y=t.y, m=t.m;
  for(let i=0;i<5 && out.length<5;i++){
    const eom=new Date(Date.UTC(y,m,0)).getUTCDate();   // آخر يوم في الشهر
    [10,20,eom].forEach(d=>{ if(out.length>=5)return; const c={y,m,d};
      if(ymdToUTC(c)>=ymdToUTC(t) && !out.some(x=>x.y===c.y&&x.m===c.m&&x.d===c.d)) out.push(c); });
    m+=1; if(m>12){m=1;y+=1;}
  }
  out.sort((a,b)=>ymdToUTC(a)-ymdToUTC(b));
  const MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  return out.slice(0,5).map(d=>{ const eom=new Date(Date.UTC(d.y,d.m,0)).getUTCDate();
    return {d, label:(d.d===eom?("آخر "+MON[d.m-1]):(d.d+" "+MON[d.m-1]))}; });
}

function settledOf(u){
  if(u.settled) return u.settled;
  const anchor=unitAnchor(u)||{day:1,month:1};
  const all=Object.keys(u.grid).map(Number).sort((a,b)=>a-b).filter(i=>u.grid[i].due>0);
  let last=null;
  for(const i of all){ if(isMonthSkip(u,i) || effRem(u,i)<=0.0001) last=i; else break; }
  return last!=null?addDaysYmd(periodStart(anchor,last+1),-1):null;
}

  return            {t:"معلومة",rank:2, dot:"bg-stone-500",  chip:"bg-stone-50 text-stone-700 border-stone-200",  hex:"#0284c7"};
}

function compReportRows(){
  const comps=allCompounds();
  if(!state.repCompound||comps.indexOf(state.repCompound)<0) state.repCompound=comps[0]||null;
  const comp=state.repCompound;
  const units=[]; state.owners.forEach(o=>o.units.forEach(u=>{ if(u.project===comp) units.push({o,u}); }));
  const monthSet={}; units.forEach(x=>Object.keys(x.u.grid).forEach(k=>{ if(x.u.grid[k].due>0) monthSet[+k]=1; }));
  const months=Object.keys(monthSet).map(Number).sort((a,b)=>a-b);
  if(state.repMonthIdx==null||months.indexOf(state.repMonthIdx)<0){ const t=todayYmd(); const cur=t.y*12+(t.m-1); state.repMonthIdx=(months.indexOf(cur)>=0)?cur:(months.length?months[months.length-1]:null); }
  const idx=state.repMonthIdx, sort=state.repSort||"desc";
  const all=units.map(x=>({o:x.o,u:x.u,rent:(x.u.grid[idx]?x.u.grid[idx].due:0)})).filter(r=>r.rent>0);
  const groups={}; all.forEach(r=>{const b=norm(r.u.beds)||"غير محدّد";(groups[b]=groups[b]||[]).push(r);});
  const allKeys=Object.keys(groups).sort((a,b)=>{const na=parseFloat(a),nb=parseFloat(b),aN=!isNaN(na),bN=!isNaN(nb);if(aN&&bN)return na-nb;if(aN)return -1;if(bN)return 1;return String(a).localeCompare(String(b),"ar");});
  allKeys.forEach(k=>groups[k].sort((a,b)=>sort==="desc"?b.rent-a.rent:a.rent-b.rent));
  const bedSel=state.repBeds; const keys=(bedSel&&bedSel.size)?allKeys.filter(k=>bedSel.has(k)):allKeys;
  const count=keys.reduce((s,k)=>s+groups[k].length,0);
  const cb={}; units.forEach(x=>{const bk=norm(x.u.beds)||"غير محدّد";cb[bk]=1;});
  const compBeds=Object.keys(cb).sort((a,b)=>{const na=parseFloat(a),nb=parseFloat(b),aN=!isNaN(na),bN=!isNaN(nb);if(aN&&bN)return na-nb;if(aN)return -1;if(bN)return 1;return String(a).localeCompare(String(b),"ar");});
  return {comp,comps,months,idx,sort,groups,keys,allKeys,compBeds,count};
}

function screenTitle(){
  if(!SB.signedIn && !state.localOnly) return "تسجيل الدخول";

  if(state.pending) return "استيراد بيانات";

    case "owner": return "صفحة المالك";

// يخفي آخر اختيارات التاريخ اللي مش مكفّيها السطر (غير المختار) لحد ما السطر يكفي
function fitRows(){
  document.querySelectorAll(".fitrow").forEach(row=>{
    const cs=[...row.querySelectorAll(".fc")]; cs.forEach(c=>{ c.style.display=""; });
    let guard=0;
    while(row.scrollWidth>row.clientWidth+1 && guard++<10){
      const vis=cs.filter(c=>c.style.display!=="none"); if(!vis.length) break;
      const cand=vis.filter(c=>!c.classList.contains("fon")); (cand.length?cand[cand.length-1]:vis[vis.length-1]).style.display="none";
    }
  });
}
window.addEventListener("resize",function(){ try{fitRows();}catch(e){} });
// سطر الكمبوند: لو الخط على الجهاز أعرض من المتوقع، صغّره درجة درجة عشان يفضل سطر واحد
function fitShrink(){
  document.querySelectorAll(".fitshrink").forEach(row=>{
    const bs=[...row.querySelectorAll("button")]; bs.forEach(x=>{ x.style.fontSize=""; x.style.paddingLeft=""; x.style.paddingRight=""; }); row.style.flexWrap="";
    const steps=[[10,7],[9.5,6],[9,5]];
    for(let k=0;k<steps.length && row.scrollWidth>row.clientWidth+1;k++){ bs.forEach(x=>{ x.style.fontSize=steps[k][0]+"px"; x.style.paddingLeft=x.style.paddingRight=steps[k][1]+"px"; }); }
    if(row.scrollWidth>row.clientWidth+1) row.style.flexWrap="wrap";
  });
}
window.addEventListener("resize",function(){ try{fitShrink();}catch(e){} });

/* ============================ cloud sync layer ============================ */
/* شبه-آلية: ملف JSON واحد في مجلد سحابي متزامن (Dropbox/Drive) عبر File System Access API.
   الـhandle متخزّن في IndexedDB. localStorage يفضل شبكة الأمان المحلية — دي إضافة فوقه. */
const SYNC = (function(){
  const SYNC_FILE = "sync-"+APP_ID+".json";     // مُشتق تلقائيًا من المعرّف
  const IDB_NAME  = APP_ID+"-sync";
  const IDB_STORE = "handles";
  const IDB_KEY   = "fileHandle";
  const supported = (typeof window!=="undefined") && ("showSaveFilePicker" in window) && ("showOpenFilePicker" in window) && ("indexedDB" in window);
  let handle=null, status="idle", lastMsg="";

  function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
  async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,"readonly"); const g=tx.objectStore(IDB_STORE).get(k); g.onsuccess=()=>res(g.result||null); g.onerror=()=>rej(g.error); }); }
  async function idbDel(k){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

  // كل مفاتيح localStorage الخاصة بالأداة (بادئة APP_ID:)
  function appKeys(){ const out=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(APP_ID+":")===0) out.push(k); } return out; }
  function snapshot(){ const data={}; appKeys().forEach(k=>{ data[k]=localStorage.getItem(k); }); return { app:APP_ID, version:1, savedAt:new Date().toISOString(), data }; }
  function localSavedAt(){ // أحدث savedAt محلي = آخر باكاب مسجّل
    try{ return (state.backup&&state.backup.lastAt)?new Date(state.backup.lastAt).toISOString():null; }catch(e){ return null; } }

  async function verifyPermission(h,write){ const opts={mode:write?"readwrite":"read"};
    if((await h.queryPermission(opts))==="granted") return true;
    if((await h.requestPermission(opts))==="granted") return true;
    return false; }

  async function writeFile(){ if(!handle) return false;
    if(!(await verifyPermission(handle,true))){ lastMsg="محتاج إذن الكتابة."; return false; }
    const w=await handle.createWritable(); await w.write(JSON.stringify(snapshot(),null,2)); await w.close();
    status="ok"; lastMsg="اتحفظ في السحابة "+new Date().toLocaleTimeString("ar-EG"); return true; }

  async function readFile(){ if(!handle) return null;
    if(!(await verifyPermission(handle,false))){ lastMsg="محتاج إذن القراءة."; return null; }
    const f=await handle.getFile(); const txt=await f.text(); if(!txt.trim()) return null;
    let obj; try{ obj=JSON.parse(txt); }catch(e){ lastMsg="ملف المزامنة تالف (JSON غير صالح)."; return {error:"parse"}; }
    // (بند 5) تحقّق الهوية قبل أي تحميل
    if(!obj || obj.app!==APP_ID){ lastMsg="⚠ الملف ده بتاع أداة تانية ("+((obj&&obj.app)||"غير معروف")+") — مش هيتحمّل."; return {error:"identity"}; }
    return obj; }

  // تطبيق snapshot على localStorage ثم إعادة تحميل الحالة
  function applySnapshot(obj){ if(!obj||!obj.data) return false;
    appKeys().forEach(k=>{ if(!(k in obj.data)) localStorage.removeItem(k); });
    Object.keys(obj.data).forEach(k=>{ if(k.indexOf(APP_ID+":")===0) localStorage.setItem(k, obj.data[k]); });
    load(); computeAll(); return true; }

  async function connect(){ if(!supported){ lastMsg="المزامنة السحابية تشتغل على Chrome/Edge كمبيوتر فقط."; return {ok:false,msg:lastMsg}; }
    if(typeof location!=="undefined" && location.protocol==="file:"){ lastMsg="⚠ المزامنة مش بتشتغل والملف مفتوح كـ file:// — لازم يتفتح من خلال رابط https:// (استضافة). البدائل: استخدم الاستيراد/التصدير اليدوي، أو ارفع الأداة على استضافة."; return {ok:false,msg:lastMsg}; }
    try{
      const h=await window.showSaveFilePicker({ suggestedName:SYNC_FILE, types:[{description:"Sync JSON",accept:{"application/json":[".json"]}}] });
      handle=h; await idbSet(IDB_KEY,h);
      const existing=await readFile();
      if(existing&&existing.error==="identity"){ handle=null; await idbDel(IDB_KEY); return {ok:false,msg:lastMsg}; }
      if(existing&&existing.data){ await mergeNewest(existing); }
      else { await writeFile(); }
      status="ok"; return {ok:true,msg:"اتربط ملف المزامنة ✓"};
    }catch(e){ if(e&&e.name==="AbortError") return {ok:false,msg:""};
      lastMsg="فشل الربط: "+((e&&(e.message||e.name))||e)+" — لو الأداة مفتوحة كـ file:// المزامنة محتاجة https://."; return {ok:false,msg:lastMsg}; }
  }

  // قارن savedAt بالمحلي وحمّل الأحدث فقط
  async function mergeNewest(remote){ const rAt=remote&&remote.savedAt?Date.parse(remote.savedAt):0;
    const lAtRaw=localSavedAt(); const lAt=lAtRaw?Date.parse(lAtRaw):0;
    if(rAt>lAt){ applySnapshot(remote); lastMsg="اتحمّلت أحدث نسخة من السحابة ✓"; return "pulled"; }
    else { await writeFile(); return "pushed"; } }

  async function restoreHandle(){ if(!supported) return false; try{ const h=await idbGet(IDB_KEY); if(h){ handle=h; return true; } }catch(e){} return false; }

  async function autoPull(){ if(!handle) return {ok:false,silent:true};
    const obj=await readFile();
    if(!obj) return {ok:false,msg:lastMsg};
    if(obj.error) return {ok:false,msg:lastMsg};
    const r=await mergeNewest(obj); return {ok:true,pulled:r==="pulled",msg:lastMsg}; }

  async function saveNow(){ const ok=await writeFile(); return {ok,msg:lastMsg}; }
  async function disconnect(){ handle=null; try{ await idbDel(IDB_KEY); }catch(e){} status="idle"; lastMsg="اتفصل ملف المزامنة."; }

  return { get supported(){return supported;}, get connected(){return !!handle;}, get status(){return status;}, get lastMsg(){return lastMsg;},
           get fileName(){return SYNC_FILE;}, connect, disconnect, saveNow, autoPull, restoreHandle, writeFileQuiet:writeFile };
})();


/* ============================ GitHub cloud storage ============================ */
/* تخزين الداتا كملف JSON في repository خاص على GitHub — يشتغل من أي جهاز (لاب/فون).
   الحفظ تلقائي بعد كل تعديل. GitHub بيحتفظ بتاريخ كل نسخة تلقائيًا. */
const GH = (function(){
  const CFG_KEY = APP_ID + ":gh";
  const FILE     = "data-" + APP_ID + ".json";
  let cfg = null, sha = null, busy = false, lastMsg = "", lastAt = 0, lastErr = "";

  function loadCfg(){ if(cfg)return cfg; try{ cfg = JSON.parse(localStorage.getItem(CFG_KEY)||"null"); }catch(e){ cfg=null; } return cfg; }
  function saveCfg(c){ cfg=c; try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }
  function clearCfg(){ cfg=null; sha=null; try{ localStorage.removeItem(CFG_KEY); }catch(e){} }
  function configured(){ const c=loadCfg(); return !!(c && c.token && c.owner && c.repo); }
  function path(){ const c=loadCfg(); return (c&&c.path)?c.path:FILE; }
  function branch(){ const c=loadCfg(); return (c&&c.branch)?c.branch:"main"; }

  // Base64 آمن للعربي (UTF-8)
  function b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=""; bytes.forEach(x=>bin+=String.fromCharCode(x)); return btoa(bin); }
  function b64dec(b64){ const bin=atob(String(b64).replace(/\s/g,"")); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i); return new TextDecoder("utf-8").decode(bytes); }

  function appKeys(){ const out=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(APP_ID+":")===0 && k!==CFG_KEY) out.push(k); } return out; }
  function snapshot(){ const data={}; appKeys().forEach(k=>{ data[k]=localStorage.getItem(k); }); return { app:APP_ID, version:1, savedAt:new Date().toISOString(), data }; }

  function api(url, opts){ const c=loadCfg();
    return fetch(url, Object.assign({}, opts, { headers: Object.assign({
      "Authorization":"Bearer "+c.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"
    }, (opts&&opts.headers)||{}) })); }
  function fileUrl(){ const c=loadCfg(); return "https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo)+"/contents/"+encodeURI(path())+"?ref="+encodeURIComponent(branch()); }
  function putUrl(){ const c=loadCfg(); return "https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo)+"/contents/"+encodeURI(path()); }

  async function testConnection(){ if(!configured()) return {ok:false,msg:"البيانات ناقصة."};
    try{ const c=loadCfg(); const r=await api("https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo));
      if(r.status===401) return {ok:false,msg:"التوكن غير صالح أو منتهي."};
      if(r.status===404) return {ok:false,msg:"المستودع مش موجود أو التوكن مالوش صلاحية عليه."};
      if(!r.ok) return {ok:false,msg:"خطأ من GitHub ("+r.status+")."};
      return {ok:true,msg:"الاتصال تمام ✓"};
    }catch(e){ return {ok:false,msg:"تعذّر الاتصال بالإنترنت."}; } }

  // قراءة الملف من GitHub
  async function pull(){ if(!configured()) return {ok:false,silent:true};
    try{ const r=await api(fileUrl());
      if(r.status===404){ sha=null; return {ok:true,empty:true,msg:"مفيش ملف على GitHub لسه — هيتعمل عند أول حفظ."}; }
      if(r.status===401){ lastErr="auth"; return {ok:false,msg:"التوكن غير صالح."}; }
      if(!r.ok) return {ok:false,msg:"تعذّرت القراءة ("+r.status+")."};
      const j=await r.json(); sha=j.sha;
      let obj; try{ obj=JSON.parse(b64dec(j.content)); }catch(e){ return {ok:false,msg:"الملف على GitHub تالف."}; }
      if(!obj || obj.app!==APP_ID) return {ok:false,msg:"⚠ الملف ده بتاع أداة تانية ("+((obj&&obj.app)||"غير معروف")+") — مش هيتحمّل."};
      return {ok:true,obj};
    }catch(e){ return {ok:false,msg:"تعذّر الاتصال بالإنترنت."}; } }

  function applySnapshot(obj){ if(!obj||!obj.data) return false;
    appKeys().forEach(k=>{ if(!(k in obj.data)) localStorage.removeItem(k); });
    Object.keys(obj.data).forEach(k=>{ if(k.indexOf(APP_ID+":")===0 && k!==CFG_KEY) localStorage.setItem(k, obj.data[k]); });
    load(); computeAll(); return true; }

  // كتابة الملف
  async function push(force){ if(!configured()) return {ok:false,silent:true};
    if(busy) return {ok:false,silent:true};
    busy=true;
    try{
      if(sha===null && !force){ try{ const r0=await api(fileUrl()); if(r0.ok){ const j0=await r0.json(); sha=j0.sha; } }catch(e){} }
      const body={ message:"تحديث بيانات "+APP_ID+" — "+new Date().toLocaleString("ar-EG"), content:b64enc(JSON.stringify(snapshot(),null,2)), branch:branch() };
      if(sha) body.sha=sha;
      const r=await api(putUrl(), {method:"PUT", body:JSON.stringify(body)});
      if(r.status===409 || r.status===422){ // تعارض: الملف اتغيّر من جهاز تاني
        const p=await pull();
        if(p.ok && p.obj){ lastMsg="⚠ الملف اتغيّر من جهاز تاني — راجع قبل الحفظ."; return {ok:false,conflict:true,remote:p.obj,msg:lastMsg}; }
        return {ok:false,msg:"تعارض في الحفظ — جرّب تاني."};
      }
      if(r.status===401){ lastErr="auth"; lastMsg="التوكن غير صالح."; return {ok:false,msg:lastMsg}; }
      if(!r.ok){ lastMsg="تعذّر الحفظ ("+r.status+")."; return {ok:false,msg:lastMsg}; }
      const j=await r.json(); sha=(j.content&&j.content.sha)||null; lastAt=Date.now(); lastErr="";
      lastMsg="اتحفظ على GitHub "+new Date().toLocaleTimeString("ar-EG");
      return {ok:true,msg:lastMsg};
    }catch(e){ lastMsg="تعذّر الاتصال بالإنترنت — التعديلات محفوظة محليًا."; return {ok:false,msg:lastMsg}; }
    finally{ busy=false; } }

  // عند الفتح: حمّل الأحدث
  async function boot(){ if(!configured()) return {ok:false,silent:true};
    const p=await pull();
    if(!p.ok) return p;
    if(p.empty){ return await push(true); }
    const remoteAt = p.obj&&p.obj.savedAt ? Date.parse(p.obj.savedAt) : 0;
    let localAt = 0; try{ const bk=state.backup&&state.backup.lastAt; localAt = bk?bk:0; }catch(e){}
    // البيانات السحابية هي المرجع عند الفتح (أحدث نسخة محفوظة من أي جهاز)
    applySnapshot(p.obj);
    return {ok:true,pulled:true,msg:"اتحمّلت البيانات من GitHub ✓"};
  }

  return { get configured(){return configured();}, get busy(){return busy;}, get lastMsg(){return lastMsg;}, get lastAt(){return lastAt;}, get lastErr(){return lastErr;},
           get fileName(){return path();}, get cfg(){return loadCfg();},
           saveCfg, clearCfg, testConnection, pull, push, boot, applySnapshot };
})();

    if(newest && (Date.now()-newest) < BACKUP_DAYS*86400000) return;   // لسه ما عداش أسبوع
    exportBackup();
    try{ localStorage.setItem(AUTOBK_KEY,String(Date.now())); }catch(e){}
    state.flash="اتنزّلت نسخة احتياطية تلقائية (أسبوعية) ✓";
  }catch(e){}
}
(async function initSB(){ try{
  if(!SB.signedIn){ render(); return; }
  state.sbBusy=true; renderSyncBar();
  const r=await SB.boot();
  state.sbBusy=false;
  if(r&&r.msg){ state.sbMsg=r.msg; state.sbOk=!!r.ok; }
  if(r&&!r.ok&&/الإنترنت/.test(r.msg||"")) state.sbOffline=true;
  render();
  setTimeout(function(){ autoBackupCheck(); render(); }, 3000);
}catch(e){ state.sbBusy=false; state.sbOffline=true; render(); } })();
(async function initGH(){ try{
  if(!GH.configured) return;
  state.ghBusy=true; renderSyncBar();
  const r=await GH.boot();
  state.ghBusy=false;
  if(r&&r.msg){ state.ghMsg=r.msg; state.ghOk=!!r.ok; }
  render();
}catch(e){ state.ghBusy=false; } })();
(async function initSync(){ try{
  if(!SYNC_UI_ENABLED) return;
  if(!SYNC.supported) return;
  const had=await SYNC.restoreHandle();
  if(had){ const r=await SYNC.autoPull(); if(r&&r.msg){ state.syncMsg=r.msg; } render(); }
}catch(e){} })();
document.addEventListener("visibilitychange",function(){
  try{ if(document.visibilityState==="hidden" && typeof SB!=="undefined" && SB.signedIn && pendCount()>0){
      if(_sbTimer)clearTimeout(_sbTimer);
      SB.push().then(function(r){ if(r&&r.ok) pendClear(); });
    } }catch(e){}
});
window.addEventListener("beforeunload",function(e){
  try{ if(SYNC_UI_ENABLED && SYNC.connected) SYNC.writeFileQuiet(); }catch(e2){}
  // تحذير قبل الإغلاق لو فيه تعديلات لسه ما اترفعتش
  try{ if(typeof SB!=="undefined" && SB.signedIn && pendCount()>0){
      SB.push();                                  // محاولة أخيرة
      e.preventDefault(); e.returnValue="فيه تعديلات لسه ما اترفعتش للسحابة.";
      return e.returnValue;
    } }catch(e3){}
});
</script>
